<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Param "description" }}">
  <style>
    :root {
      --bg: #1a1d23;
      --bg-card: #22252d;
      --bg-card-hover: #282b34;
      --text: #e1e3e8;
      --text-muted: #8b8f98;
      --accent: #4a9eff;
      --border: #333840;
      --radius: 8px;
      --max-w: 1100px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0}
    body{font:16px/1.6 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .container{max-width:var(--max-w);margin:0 auto;padding:0 24px}
    header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;z-index:10}
    header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    header h1{font-size:1.15rem;font-weight:600}
    header h1 a{color:var(--text)}
    nav{display:flex;gap:6px;flex-wrap:wrap}
    nav a{padding:4px 12px;border-radius:var(--radius);font-size:0.88rem;color:var(--text-muted);transition:all .15s}
    nav a:hover,nav a.active{color:var(--text);background:var(--bg-card-hover);text-decoration:none}
    .model-section{background:var(--bg-card);border-bottom:1px solid var(--border)}
    .model-container{width:100%;height:65vh;min-height:400px;max-height:700px;position:relative}
    model-viewer{width:100%;height:100%;background:#1a1d23}
    .model-overlay{position:absolute;bottom:20px;left:24px;z-index:2;pointer-events:none}
    .model-overlay h2{font-size:1.3rem;font-weight:600;color:var(--text);text-shadow:0 1px 4px rgba(0,0,0,.6)}
    .model-overlay p{font-size:0.85rem;color:var(--text-muted);text-shadow:0 1px 3px rgba(0,0,0,.5)}
    main{padding:40px 0 60px}
    article{max-width:800px;margin:0 auto}
    article h2{font-size:1.5rem;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);color:var(--accent)}
    article h3{font-size:1.15rem;margin:24px 0 8px}
    article p{margin:8px 0;color:var(--text-muted)}
    article ul,article ol{margin:8px 0;padding-left:24px;color:var(--text-muted)}
    article li{margin:4px 0}
    table{width:100%;border-collapse:collapse;margin:16px 0;font-size:0.9rem}
    th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
    th{color:var(--text);font-weight:600;background:var(--bg-card)}
    td{color:var(--text-muted)}
    tr:hover td{background:rgba(255,255,255,0.02)}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:16px 0}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .15s}
    .card:hover{border-color:var(--accent);background:var(--bg-card-hover)}
    .card h3{font-size:1rem;margin:0 0 6px}
    .card p{font-size:0.88rem;margin:0}
    .hero{text-align:center;padding:48px 24px;max-width:800px;margin:0 auto}
    .hero h2{font-size:2rem;border:none;color:var(--text);margin-bottom:12px}
    .hero p{font-size:1.1rem}
    .stats{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin:24px 0}
    .stat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 24px;text-align:center;min-width:120px}
    .stat strong{display:block;font-size:2rem;color:var(--accent)}
    .stat span{font-size:0.8rem;color:var(--text-muted)}
    footer{border-top:1px solid var(--border);padding:24px 0;text-align:center;font-size:0.85rem;color:var(--text-muted)}
    @media(max-width:700px){
      header h1{font-size:1rem}
      nav a{font-size:0.78rem;padding:3px 8px}
      .model-container{height:50vh;min-height:300px}
      .hero h2{font-size:1.4rem}
      .stats{gap:12px}
      .stat{padding:12px 16px}
      .stat strong{font-size:1.4rem}
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
      <nav>
        <a href="{{ .Site.BaseURL }}" {{ if .IsHome }}class="active"{{ end }}>Overview</a>
        {{ range .Site.Sections }}
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  {{ block "main" . }}{{ end }}
  <footer>
    <div class="container">
      1370 Wilbur Avenue, San Diego, CA 92109 · Draft design-development report · {{ now.Format "January 2006" }}
    </div>
  </footer>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
