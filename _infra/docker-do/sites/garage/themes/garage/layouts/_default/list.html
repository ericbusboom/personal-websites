{{ define "main" }}
<main>
  <article>
    <h2>{{ .Title }}</h2>
    {{ .Content }}
    <div class="card-grid">
      {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="card">
        <h3>{{ .Title }}</h3>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </a>
      {{ end }}
    </div>
  </article>
</main>
{{ end }}
