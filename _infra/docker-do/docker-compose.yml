# Docker Compose — docker1 (VPC-private droplet, 10.124.0.2)
#
# Services:
#   garage   — Hugo static site at garage.busboom.org
#   caddy    — Internal reverse proxy (optional, for multi-service routing)
#
# The public Caddy droplet at 143.110.228.9 proxies to docker1:8080

services:
  garage:
    image: nginx:alpine
    container_name: garage
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./sites/garage/public:/usr/share/nginx/html:ro
      - ./nginx-garage.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - services

networks:
  services:
    driver: bridge