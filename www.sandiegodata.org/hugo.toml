baseURL = "https://www.sandiegodata.org/"
languageCode = "en-us"
title = "San Diego Regional Data Library"
theme = "wp-static"

[pagination]
pagerSize = 10

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "friendly"

[params]
description = "Providing Data For Civic and Social Development"
sidebar = true
showCategories = true
logo = "/header-logo.png"

# Blog posts live in year folders (/2019/05/...), so their type would be the
# year. Give them all type "post" for the post lists.
[[cascade]]
type = "post"
[cascade.target]
path = "{/20*/**}"

# Menus follow the WordPress menus of www.sandiegodata.org, with the data
