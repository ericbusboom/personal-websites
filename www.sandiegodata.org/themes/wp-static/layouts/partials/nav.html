<nav class="main-nav" aria-label="Primary">
    <button class="nav-toggle" aria-label="Menu" onclick="this.classList.toggle('active'); this.parentElement.classList.toggle('open')">
        <span class="mobile-menu">Menu</span>
    </button>
    <ul class="nav-menu">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ if .HasChildren }}
        <ul>
            {{ range .Children }}
            <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
            {{ end }}
        </ul>
        {{ end }}
        </li>
        {{ end }}
    </ul>
</nav>
