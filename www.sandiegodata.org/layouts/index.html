{{ define "main" }}
<article class="page">
    <div class="entry-content">{{ .Content }}</div>
</article>
<div class="post-listing">
    {{ range first 5 (where site.RegularPages "Type" "post") }}
    <article class="post type-post">
        <header class="entry-header">
            <h2 class="entry-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            {{ partial "post-meta.html" . }}
        </header>
        <div class="entry-content">{{ .Summary }}</div>
        <a href="{{ .RelPermalink }}" class="read-more">Continue Reading →</a>
    </article>
    {{ end }}
    <p><a href="{{ "blog/" | relURL }}" class="read-more">All blog posts →</a></p>
</div>
{{ end }}
